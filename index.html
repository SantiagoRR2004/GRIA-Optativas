<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Optativas</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        h1,
        h2,
        h3,
        ul,
        p {
            max-width: 900px;
            margin: 1em auto;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1em auto;
        }

        table {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div id="content"></div>
    <script>
        const contentEl = document.getElementById("content");
        const defaultMd = "./README.md";

        const resolvePath = (href) => new URL(href, window.location.href).pathname;

        const renderMarkdown = (text, basePath) => {
            const cleaned = text.replace(/<img width="1000"><br>/g, "");
            const renderer = new marked.Renderer();
            const originalImageRenderer = renderer.image.bind(renderer);
            const originalLinkRenderer = renderer.link.bind(renderer);

            // Support both legacy (href, title, text) and new ({ href, ... }) renderer signatures.
            const resolveHref = (rawHref) => {
                if (typeof rawHref !== "string" || rawHref.length === 0) return "";
                if (rawHref.startsWith("http://") || rawHref.startsWith("https://") || rawHref.startsWith("/")) {
                    return rawHref;
                }
                return new URL(rawHref, basePath || window.location.href).href;
            };

            const callRenderer = (rendererFn, token, fallbackArgs) => {
                if (rendererFn.length >= 3) {
                    return rendererFn(...fallbackArgs);
                }
                return rendererFn(token);
            };

            renderer.image = (tokenOrHref, title, text) => {
                const token = typeof tokenOrHref === "string" ? { href: tokenOrHref, title, text } : (tokenOrHref || {});
                const resolvedHref = resolveHref(token.href);
                const nextToken = { ...token, href: resolvedHref };
                return callRenderer(originalImageRenderer, nextToken, [resolvedHref, title, text]);
            };

            renderer.link = (tokenOrHref, title, text) => {
                const token = typeof tokenOrHref === "string" ? { href: tokenOrHref, title, text } : (tokenOrHref || {});
                const resolvedHref = resolveHref(token.href);
                const nextToken = { ...token, href: resolvedHref };
                return callRenderer(originalLinkRenderer, nextToken, [resolvedHref, title, text]);
            };

            contentEl.innerHTML = marked.parse(cleaned, { renderer });
        };

        const loadMarkdown = (path, { push } = { push: false }) => {
            fetch(path)
                .then((response) => {
                    if (!response.ok) {
                        throw new Error(`No se pudo cargar ${path}`);
                    }
                    return response.text();
                })
                .then((text) => {
                    const resolvedPath = new URL(path, window.location.href).href;
                    const basePath = resolvedPath.substring(0, resolvedPath.lastIndexOf("/") + 1);
                    renderMarkdown(text, basePath);

                    if (push) {
                        const newUrl = `${window.location.pathname}?md=${path}`;
                        history.pushState({ md: path }, "", newUrl);
                    }
                })
                .catch((error) => {
                    contentEl.innerHTML = `<p>${error.message}</p>`;
                });
        };

        const initialMd = new URLSearchParams(window.location.search).get("md") || defaultMd;
        loadMarkdown(initialMd);

        contentEl.addEventListener("click", (event) => {
            const anchor = event.target.closest("a");
            if (!anchor) return;

            const href = anchor.getAttribute("href");
            if (!href) return;

            // Check if it's an external link (different origin)
            if (href.startsWith("http") && !href.startsWith(window.location.origin)) return;

            // Extract the path from full URL or use as-is
            let targetPath = href;
            if (href.startsWith(window.location.origin)) {
                targetPath = href.substring(window.location.origin.length);
            }

            if (!targetPath.toLowerCase().endsWith(".md")) return;

            event.preventDefault();
            loadMarkdown(targetPath, { push: true });
        });

        window.addEventListener("popstate", (event) => {
            const md = event.state?.md || new URLSearchParams(window.location.search).get("md") || defaultMd;
            loadMarkdown(md);
        });
    </script>
</body>

<script>
    const currentUrl = window.location.href;
    const urlParts = new URL(currentUrl);
    const username = urlParts.hostname.split(".")[0];
    const script = document.createElement("script");
    script.src = `https://${username}.github.io/scripts/tableFunctions.js`;
    document.head.appendChild(script);
</script>

</html>
